<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AccessHub - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back</h2>

            <form id="loginForm" class="auth-form">
                <input type="text" id="email" class="auth-input" placeholder="Email">
                <span id="emailErr" class="error"></span>
                <input type="password" id="password" class="auth-input" placeholder="Password">
                <span id="passErr" class="error"></span>
                <button type="submit" class="auth-button" onclick="validateForm()">Login</button>
            </form>

            <p class="auth-footer">
                Don’t have an account?
                <a href="register.html" class="auth-link">Register</a>
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
