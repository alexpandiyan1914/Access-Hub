<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AccessHub - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>

            <form id="registerForm" class="auth-form">
                <input type="text" id="name" class="auth-input" placeholder="Username">
                <span id="nameErr" class="error"></span>
                <input type="text" id="email" class="auth-input" placeholder="Email">
                <span id="emailErr" class="error"></span>
                <input type="password" id="password" class="auth-input" placeholder="Password">
                <span id="passErr" class="error"></span>
                <button type="submit" class="auth-button" onclick="validateForm()">Register</button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html" class="auth-link">Login</a>
            </p>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
