<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AccessHub - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <div class="home-container">
        <div class="home-card">
            <h1 class="home-title">Welcome to AccessHub !</h1>

            <p class="home-message">

            <button id="delete-acc" class="ld-button">Delete Account</button>
        </div>
    </div>

    <p class="footer"><a href="https://github.com/alexpandiyan1914/Access-Hub.git" target="_blank">AccessHub</a> is open for contributions — fork,
